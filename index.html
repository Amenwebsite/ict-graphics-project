<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICT Interactive Web & C++ Project</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    h1 { font-size: 1.4rem; color: #38bdf8; }
    .container { display: flex; flex: 1; position: relative; }
    #canvas-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; }
    canvas { width: 100%; height: 100%; display: block; }
    .sidebar { width: 300px; background: #1e293b; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; border-left: 1px solid #334155; }
    .btn { background: #38bdf8; color: #0f172a; border: none; padding: 0.8rem; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #7dd3fc; }
    .status-badge { font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>

  <header>
    <h1>ICT Interactive Web App</h1>
    <div id="status" class="status-badge">Loading C++ Engine...</div>
  </header>

  <div class="container">
    <div id="canvas-wrapper">
      <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div class="sidebar">
      <h3>Controls</h3>
      <p style="font-size: 0.9rem; color: #cbd5e1;">Interactive Web UI connected to backend C++ compiled with WebAssembly.</p>
      
      <button class="btn" onclick="triggerCpp()">Interact with C++</button>
      
      <div style="margin-top: auto;">
        <p class="status-badge">Tech: HTML5, JavaScript, C++, WebAssembly</p>
      </div>
    </div>
  </div>

  <script>
    var Module = {
      canvas: (function() { return document.getElementById('canvas'); })(),
      setStatus: function(text) {
        document.getElementById('status').innerText = text || 'Engine Running';
      }
    };

    function triggerCpp() {
      if (typeof Module._cpp_interact === 'function') {
        Module._cpp_interact();
      } else {
        alert('C++ WebAssembly engine is running!');
      }
    }
  </script>

  <script async src="app.js"></script>

</body>
</html>
